services:
  db:
    image: postgres:18-alpine
    container_name: redir-db
    environment:
      POSTGRES_USER: redir
      POSTGRES_PASSWORD: redir
      POSTGRES_DB: redir
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redir -d redir"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:v4.18.2
    container_name: redir-migrate
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    command: ["-path=/migrations", "-database=postgres://redir:redir@db:5432/redir?sslmode=disable", "up"]
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: redir-redis
    command: ["redis-server", "--appendonly", "no", "--save", "", "--protected-mode", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-01-18T00-31-37Z
    container_name: redir-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: redir-app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      PORT: "5000"
      SERVER_ADDRESS: ":5000"
      ENVIRONMENT: "production"
      DATABASE_URL: "postgres://redir:redir@db:5432/redir?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: ""
      STORAGE_SERVICE_ACCESS_KEY_ID: "minioadmin"
      STORAGE_SERVICE_SECRET_ACCESS_KEY: "minioadmin"
      STORAGE_SERVICE_ENDPOINT: "http://minio:9000"
      BUCKET_NAME: "redir"
      BUCKET_ROOT: "uploads"
      DOMAIN: "http://localhost:5000"
      DATA_GET_PATH: "/api/v1/assets"
      CLIENT_DASHBOARD: "http://localhost:3000"
      CLIENT_LOGIN_URL: "http://localhost:3000/login"
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""
      GOOGLE_REDIRECT_URL: ""
      GITHUB_CLIENT_ID: ""
      GITHUB_CLIENT_SECRET: ""
      GITHUB_REDIRECT_URL: ""
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/api/v1/readyz"]
      interval: 60s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

volumes:
  pgdata:
  minio-data:
